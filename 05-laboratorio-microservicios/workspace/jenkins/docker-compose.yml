# Jenkins + SonarQube locales para ejecutar el pipeline simulado.
# Uso: cp .env.example .env  (y completar)  →  docker compose up -d --build  →  http://localhost:8085
services:
  jenkins:
    build: .
    container_name: jenkins   # el pipeline usa --volumes-from jenkins para compartir el workspace con las herramientas
    ports:
      - "8085:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?define JENKINS_ADMIN_PASSWORD en .env}
      DOCKERHUB_USERNAME: ${DOCKERHUB_USERNAME:-}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN:-}
      WS_DEVOPS_REPO: ${WS_DEVOPS_REPO:-https://github.com/edzamo/ws-devops.git}
      WS_DEVOPS_RAMA: ${WS_DEVOPS_RAMA:-main}
    group_add:
      - "${DOCKER_GID:?define DOCKER_GID en .env (getent group docker | cut -d: -f3)}"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # Docker del host: las imágenes se construyen ahí
    depends_on:
      - sonarqube

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data

volumes:
  jenkins-home:
  sonarqube-data:
