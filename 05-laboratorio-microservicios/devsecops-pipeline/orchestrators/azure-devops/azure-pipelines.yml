# Pipeline CI/CD de poc-credit-evaluation — versión Azure DevOps (Azure Pipelines).
# Mismos scripts y mismo orden que GitHub Actions y Jenkins: este archivo solo orquesta.
# Lo que cambia respecto de GitHub: el registro es Azure Container Registry (ACR), los secretos vienen
# de un Variable Group enlazado a Azure Key Vault, y la aprobación vive en el Environment.
#
# Requisitos en Azure DevOps (ver README.md de esta carpeta):
#   - Service connection "github-edzamo"       → leer los repos de GitHub
#   - Service connection "acr-poc-credit"      → login a ACR (identidad de Azure, sin contraseñas en el YAML)
#   - Variable group "poc-credit-evaluation"   → ACR_LOGIN_SERVER (y secretos, enlazado a Key Vault)
#   - Environments "test" y "simulacion-produccion" (este con Approvals and checks)

name: poc-credit-evaluation-cicd-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include: [main, feature/*]
  paths:
    include: [05-laboratorio-microservicios/devsecops-pipeline/*]

pr:
  branches:
    include: [main]

parameters:
  - name: rama
    displayName: Rama del código a construir
    type: string
    default: main
  - name: coberturaMinima
    displayName: Cobertura mínima (%)
    type: string
    default: "30"
  - name: modoEstricto
    displayName: Los hallazgos de seguridad detienen el pipeline
    type: boolean
    default: false
  - name: publicar
    displayName: Publicar las imágenes en ACR
    type: boolean
    default: false

resources:
  repositories:
    - repository: app                       # el código de la aplicación vive en su propio repo
      type: github
      endpoint: github-edzamo
      name: edzamo/poc-credit-evaluation
      ref: refs/heads/${{ parameters.rama }}
  containers:
    - container: sonarqube                  # SonarQube efímero, igual que en GitHub Actions
      image: sonarqube:26.10.0.133078-community
      ports: ["9000:9000"]
      env:
        SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"

variables:
  - group: poc-credit-evaluation            # ACR_LOGIN_SERVER (+ secretos desde Key Vault)
  - name: APP_DIR
    value: $(Pipeline.Workspace)/app
  - name: OUT_DIR
    value: $(Pipeline.Workspace)/salida
  - name: SCRIPTS
    value: $(Pipeline.Workspace)/ws-devops/05-laboratorio-microservicios/devsecops-pipeline/stages
  - name: COBERTURA_MINIMA
    value: ${{ parameters.coberturaMinima }}
  - name: MODO_ESTRICTO
    value: ${{ lower(parameters.modoEstricto) }}
  - name: REGISTRY
    value: $(ACR_LOGIN_SERVER)              # p. ej. pocregistry.azurecr.io
  - name: REGISTRY_AUTH
    value: plataforma                       # el login lo hace la tarea Docker@2 con la service connection
  # main → producción simulada (con aprobación); cualquier otra rama → test
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
      - name: ambiente
        value: simulacion-produccion
  - ${{ else }}:
      - name: ambiente
        value: test

pool:
  vmImage: ubuntu-24.04

stages:
  # ─────────────────────────── CI: ¿el código y las imágenes son aptos? ───────────────────────────
  - stage: CI
    displayName: CI (build, tests, calidad, seguridad, imágenes)
    jobs:
      - job: ci
        timeoutInMinutes: 45
        services:
          sonarqube: sonarqube
        variables:
          JAVA_HOME: $(JAVA_HOME_21_X64)    # JDK 21 ya instalado en la imagen ubuntu-24.04
        steps:
          - checkout: self                  # ws-devops: el pipeline
            path: ws-devops
          - checkout: app                   # el código, con historial completo para Gitleaks
            path: app
            fetchDepth: 0

          - script: '"$(SCRIPTS)/01-secret-scan.sh"'
            displayName: "1. Secretos (Gitleaks)"
          - script: '"$(SCRIPTS)/02-build-test.sh"'
            displayName: "2. Build + tests"
          - task: PublishTestResults@2      # resultados de tests visibles en la pestaña "Tests"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "$(APP_DIR)/**/target/surefire-reports/*.xml"
          - script: '"$(SCRIPTS)/03-coverage-gate.sh"'
            displayName: "3. Cobertura mínima"
          - script: '"$(SCRIPTS)/04-artifacts.sh"'
            displayName: "4. Verificar artefactos"
          - script: '"$(SCRIPTS)/05-code-quality.sh"'
            displayName: "5. Calidad (SonarQube)"
          - script: '"$(SCRIPTS)/06-sast-sca.sh"'
            displayName: "6. SAST + SCA"
          - script: '"$(SCRIPTS)/07-image-build.sh"'
            displayName: "7. Imágenes Docker"
          - script: '"$(SCRIPTS)/08-image-scan.sh"'
            displayName: "8. Escaneo de imágenes + SBOM"

          # Construir una vez: las imágenes pasan tal cual al stage de CD
          - script: |
              source "$(SCRIPTS)/lib/common.sh"
              imagenes=(); for s in "${SERVICIOS[@]}"; do imagenes+=("$(imagen_de "$s")"); done
              docker save "${imagenes[@]}" | gzip > "$(Pipeline.Workspace)/imagenes.tar.gz"
            displayName: Empaquetar imágenes para el CD
          - publish: $(Pipeline.Workspace)/imagenes.tar.gz
            artifact: imagenes
          - publish: $(OUT_DIR)            # evidencia para auditoría
            artifact: ci-reportes-y-artefactos
            condition: always()

  # ─────────────── CD: publicar y desplegar (aprobación configurada en el Environment) ───────────────
  - stage: CD
    displayName: CD (publicar, deploy simulado, DAST)
    dependsOn: CI
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: cd
        environment: ${{ variables.ambiente }}   # "simulacion-produccion" exige aprobación (Approvals and checks)
        timeoutInMinutes: 30
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  path: ws-devops
                - checkout: app             # mismo commit que pasó el CI
                  path: app
                - download: current
                  artifact: imagenes
                - script: gunzip -c "$(Pipeline.Workspace)/imagenes/imagenes.tar.gz" | docker load
                  displayName: Cargar las imágenes construidas en el CI

                # Login a ACR con la identidad de Azure: ninguna contraseña en el pipeline
                - task: Docker@2
                  displayName: Login a Azure Container Registry
                  condition: eq('${{ parameters.publicar }}', 'true')
                  inputs:
                    command: login
                    containerRegistry: acr-poc-credit
                - script: '"$(SCRIPTS)/09-image-publish.sh"'
                  displayName: "9. Publicar en ACR"
                  env:
                    PUBLICAR: ${{ lower(parameters.publicar) }}
                - script: '"$(SCRIPTS)/10-deploy-dast.sh"'
                  displayName: "10. Deploy simulado + smoke test + DAST"

                - publish: $(OUT_DIR)
                  artifact: cd-reportes
                  condition: always()
