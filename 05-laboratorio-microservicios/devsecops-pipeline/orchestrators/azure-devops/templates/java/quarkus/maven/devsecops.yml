# Plantilla central DevSecOps — Java / Quarkus / Maven (Azure Pipelines).
# La mantiene el equipo de plataforma DevOps en el repositorio central de plantillas. Los repos de aplicación
# NO la copian: la "extienden" desde su azure-pipelines.yml (ver ../../../../caller/azure-pipelines.yml).
#
# Ruta del catálogo: templates/<lenguaje>/<framework>/<build>/<plantilla>.yml
#
# Contrato con el pipeline que la extiende:
#   - El repo de la aplicación es `self`.
#   - Declara el repositorio de plantillas con el alias `devsecops-templates` (de ahí salen los scripts).
#   - Carga el variable group del ambiente, que debe definir: REGISTRY y PUBLICAR.
#   - Pasa el parámetro acrServiceConnection (nombre de la service connection al ACR).
#   - Declara el contenedor `sonarqube` en resources.containers.
#
# Gobernanza: los environments de test y producción tienen el check "Required template", que solo deja
# desplegar a pipelines que extienden ESTA plantilla. Nadie puede saltarse un control borrando una etapa.

parameters:
  - name: coberturaMinima
    type: string
    default: "30"
  - name: modoEstricto
    type: boolean
    default: false
  - name: vmImage
    type: string
    default: ubuntu-24.04
  - name: acrServiceConnection           # debe conocerse al compilar el pipeline: va como parámetro, no en el variable group
    type: string

variables:
  - name: APP_DIR
    value: $(Pipeline.Workspace)/app
  - name: OUT_DIR
    value: $(Pipeline.Workspace)/salida
  - name: SCRIPTS
    value: $(Pipeline.Workspace)/devsecops-templates/05-laboratorio-microservicios/devsecops-pipeline/stages
  - name: COBERTURA_MINIMA
    value: ${{ parameters.coberturaMinima }}
  - name: MODO_ESTRICTO
    value: ${{ lower(parameters.modoEstricto) }}
  - name: REGISTRY_AUTH
    value: plataforma                       # el login a ACR lo hace la service connection
  # Estrategia de ramas (GitFlow) → ambiente de despliegue
  - ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/bugfix/')) }}:
      - name: ambiente
        value: dev
  - ${{ elseif or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/')) }}:
      - name: ambiente
        value: test
  - ${{ elseif eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
      - name: ambiente
        value: simulacion-produccion
  - ${{ else }}:
      - name: ambiente
        value: ninguno                      # otras ramas: solo CI

stages:
  # ─────────────────────────── CI: ¿el código y las imágenes son aptos? ───────────────────────────
  - stage: CI
    displayName: CI (build, tests, calidad, seguridad, imágenes)
    pool:
      vmImage: ${{ parameters.vmImage }}
    jobs:
      - job: ci
        timeoutInMinutes: 45
        services:
          sonarqube: sonarqube
        variables:
          JAVA_HOME: $(JAVA_HOME_21_X64)    # JDK 21 ya instalado en la imagen ubuntu-24.04
        steps:
          - checkout: self                  # el código de la aplicación, con historial completo para Gitleaks
            path: app
            fetchDepth: 0
          - checkout: devsecops-templates   # los scripts del pipeline, en la versión fijada por el tag
            path: devsecops-templates

          - script: '"$(SCRIPTS)/01-secret-scan.sh"'
            displayName: "1. Secretos (Gitleaks)"
          - script: '"$(SCRIPTS)/02-build-test.sh"'
            displayName: "2. Build + tests"
          - task: PublishTestResults@2      # resultados de tests en la pestaña "Tests"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "$(APP_DIR)/**/target/surefire-reports/*.xml"
          - script: '"$(SCRIPTS)/03-coverage-gate.sh"'
            displayName: "3. Cobertura mínima"
          - script: '"$(SCRIPTS)/04-artifacts.sh"'
            displayName: "4. Verificar artefactos"
          - script: '"$(SCRIPTS)/05-code-quality.sh"'
            displayName: "5. Calidad (SonarQube)"
          - script: '"$(SCRIPTS)/06-sast-sca.sh"'
            displayName: "6. SAST + SCA"
          - script: '"$(SCRIPTS)/07-image-build.sh"'
            displayName: "7. Imágenes Docker"
          - script: '"$(SCRIPTS)/08-image-scan.sh"'
            displayName: "8. Escaneo de imágenes + SBOM"

          # Construir una vez: las imágenes pasan tal cual al stage de CD
          - script: |
              source "$(SCRIPTS)/lib/common.sh"
              imagenes=(); for s in "${SERVICIOS[@]}"; do imagenes+=("$(imagen_de "$s")"); done
              docker save "${imagenes[@]}" | gzip > "$(Pipeline.Workspace)/imagenes.tar.gz"
            displayName: Empaquetar imágenes para el CD
          - publish: $(Pipeline.Workspace)/imagenes.tar.gz
            artifact: imagenes
          - publish: $(OUT_DIR)            # evidencia para auditoría
            artifact: ci-reportes-y-artefactos
            condition: always()

  # ─────────────── CD: publicar y desplegar en el ambiente que corresponde a la rama ───────────────
  - ${{ if ne(variables.ambiente, 'ninguno') }}:
      - stage: CD
        displayName: CD → ${{ variables.ambiente }}
        dependsOn: CI
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        pool:
          vmImage: ${{ parameters.vmImage }}
        jobs:
          - deployment: cd
            environment: ${{ variables.ambiente }}   # aprobaciones y "Required template" se configuran en el Environment
            timeoutInMinutes: 30
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self            # mismo commit que pasó el CI
                      path: app
                    - checkout: devsecops-templates
                      path: devsecops-templates
                    - download: current
                      artifact: imagenes
                    - script: gunzip -c "$(Pipeline.Workspace)/imagenes/imagenes.tar.gz" | docker load
                      displayName: Cargar las imágenes construidas en el CI

                    # Login a ACR con la identidad de Azure: ninguna contraseña en el pipeline
                    - task: Docker@2
                      displayName: Login a Azure Container Registry
                      condition: eq(variables['PUBLICAR'], 'true')
                      inputs:
                        command: login
                        containerRegistry: ${{ parameters.acrServiceConnection }}
                    - script: '"$(SCRIPTS)/09-image-publish.sh"'
                      displayName: "9. Publicar en ACR"
                    - script: '"$(SCRIPTS)/10-deploy-dast.sh"'
                      displayName: "10. Deploy simulado + smoke test + DAST"

                    - publish: $(OUT_DIR)
                      artifact: cd-reportes
                      condition: always()
