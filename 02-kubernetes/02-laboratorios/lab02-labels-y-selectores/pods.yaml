# Lab 02 · Cuatro Pods con labels. El primero está completo como ejemplo; completa los TODO de los otros tres.
apiVersion: v1
kind: Pod
metadata:
  name: credito-dev
  namespace: lab02
  labels:
    app: credito
    entorno: dev
    tier: backend
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 64Mi }
---
