# Lab 01 · Completa los TODO. Usa como guía el tema 04 (Pods) de la documentación.
apiVersion: v1
kind: Pod
metadata:
  name: web              # nombre del Pod
  namespace: lab01         # namespace del laboratorio
  labels:
    app: web            # label "app"
    entorno: lab            # label "entorno"
spec:
  containers:
    - name: nginx          # nombre del contenedor
      image: nginx:1.27         # imagen con versión fija (nunca latest)
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
